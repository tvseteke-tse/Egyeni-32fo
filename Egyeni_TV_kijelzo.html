<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Egyéni Teke - Színes Ranglista (Online - 1920x1080)</title>
<style>
    :root {
        --row-height: 44px;
        --cell-font: 1.15rem;
        --total-font: 1.3rem;
        --header-font: 1.05rem;
        --cell-pad-y: 8px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #00122e;
        color: #ffff00;
        margin: 0;
        padding: 10px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    .board-container {
        width: 100%;
        height: 100%;
        background: #001c47;
        border: 3px solid #0044aa;
        border-radius: 12px;
        padding: 15px 20px;
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.7);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    h1 {
        text-align: center;
        margin: 0 0 12px 0;
        font-size: 2.4rem;
        color: #ffff00;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 255, 0, 0.5);
        flex-shrink: 0;
    }

    .table-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        flex: 1;
        min-height: 0;
        align-content: stretch;
    }

    table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
        table-layout: fixed;
    }

    thead {
        height: 44px;
    }

    th {
        color: #ffff00;
        border-bottom: 3px solid #0044aa;
        padding: 8px 4px;
        font-size: var(--header-font);
        background-color: #001536;
        white-space: nowrap;
    }

    tbody tr {
        height: var(--row-height);
        transition: background-color 0.2s ease;
    }

    /* Sorok elkülönítése */
    tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.03); }
    tbody tr:nth-child(odd) { background-color: rgba(0, 0, 0, 0.2); }
    tbody tr:hover { background-color: rgba(0, 85, 204, 0.3) !important; }

    td {
        padding: var(--cell-pad-y) 4px;
        text-align: center;
        border-bottom: 1px solid #003380;
        font-size: var(--cell-font);
        font-weight: bold;
        line-height: 1.1;
    }

    .rank-col { width: 48px; color: #ffffff; font-weight: bold; text-align: center; }
    .name-col { text-align: left; font-family: sans-serif; color: #ffff00; width: 165px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .club-col { text-align: left; font-family: sans-serif; color: #58a6ff; font-weight: normal; font-size: calc(var(--cell-font) * 0.9); width: 135px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-col { color: #8b949e; font-size: calc(var(--cell-font) * 0.95); }

    .color-green { color: #00ff66 !important; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }

    .total-col { font-weight: bold; font-size: var(--total-font); }
    tr.top3 { background-color: rgba(0, 68, 170, 0.45) !important; }
    tr.top3:nth-child(even) { background-color: rgba(0, 80, 195, 0.5) !important; }
    tr.top3 .rank-col { color: #ffff00; font-size: calc(var(--cell-font) * 1.1); }

    .status-bar {
        margin-top: 8px;
        font-size: 0.85rem;
        color: #8b949e;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .status-error {
        color: #ff6666;
        font-weight: bold;
    }

    .demo-btn {
        background: #0044aa;
        color: #ffff00;
        border: 1px solid #58a6ff;
        border-radius: 5px;
        padding: 3px 10px;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .demo-btn:hover {
        background: #0055cc;
    }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <h1 id="boardTitle">EGYÉNI BAJNOKSÁG</h1>
    <div class="table-grid" id="tableGrid">
        <table>
            <thead>
                <tr>
                    <th class="rank-col">#</th>
                    <th class="name-col">Név</th>
                    <th class="club-col">Egyesület</th>
                    <th class="total-col">Össz.</th>
                    <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                    <th>Teli</th>
                    <th>Tarol</th>
                    <th>Üres</th>
                </tr>
            </thead>
            <tbody id="boardBody1"></tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th class="rank-col">#</th>
                    <th class="name-col">Név</th>
                    <th class="club-col">Egyesület</th>
                    <th class="total-col">Össz.</th>
                    <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                    <th>Teli</th>
                    <th>Tarol</th>
                    <th>Üres</th>
                </tr>
            </thead>
            <tbody id="boardBody2"></tbody>
        </table>
    </div>

    <div class="status-bar">
        <span id="statusText">Csatlakozás a Firebase adatbázishoz (egyeni_bowling)...</span>
        <button type="button" class="demo-btn" id="loadDemoBtn">24 fős tesztadat betöltése</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

let lastPlayers = [];
let hasLiveData = false;

function setStatus(msg, isError = false) {
    const el = document.getElementById('statusText');
    el.textContent = msg;
    el.className = isError ? 'status-error' : '';
}

function normalizePlayers(rawPlayers) {
    if (!rawPlayers) return [];

    const list = Array.isArray(rawPlayers)
        ? rawPlayers.filter(Boolean)
        : (typeof rawPlayers === 'object' ? Object.values(rawPlayers).filter(Boolean) : []);

    return list.map((p) => {
        let sets = [0, 0, 0, 0];
        if (Array.isArray(p.sets)) {
            sets = [0, 1, 2, 3].map((i) => Number(p.sets[i]) || 0);
        } else if (p.sets && typeof p.sets === 'object') {
            sets = [0, 1, 2, 3].map((i) => Number(p.sets[i] ?? p.sets[`s${i + 1}`] ?? p.sets[`S${i + 1}`]) || 0);
        } else {
            sets = [
                Number(p.s1 ?? p.S1) || 0,
                Number(p.s2 ?? p.S2) || 0,
                Number(p.s3 ?? p.S3) || 0,
                Number(p.s4 ?? p.S4) || 0
            ];
        }

        const sumSets = sets.reduce((acc, v) => acc + v, 0);
        const total = (p.total !== undefined && p.total !== null && p.total !== '')
            ? (Number(p.total) || 0)
            : sumSets;

        return {
            name: p.name || p.nev || '-',
            club: p.club || p.egyesulet || '-',
            total,
            sets,
            teli: Number(p.teli ?? p.full ?? 0) || 0,
            tarol: Number(p.tarol ?? p.clean ?? 0) || 0,
            ures: Number(p.ures ?? p.error ?? 0) || 0
        };
    });
}

function generateDemoPlayers(count = 24) {
    const clubs = ['Szeged TE', 'Zalaegerszeg', 'BKV Előre', 'Répcelak', 'Kaposvár', 'Pápai PE'];
    return Array.from({ length: count }, (_, i) => {
        const s1 = 130 + ((i * 11) % 40);
        const s2 = 125 + ((i * 7) % 45);
        const s3 = 120 + ((i * 13) % 42);
        const s4 = 128 + ((i * 9) % 38);
        return {
            name: `Játékos ${i + 1}`,
            club: clubs[i % clubs.length],
            total: s1 + s2 + s3 + s4,
            sets: [s1, s2, s3, s4],
            teli: 85 + (i % 30),
            tarol: 20 + ((i * 3) % 18),
            ures: i % 8
        };
    });
}

try {
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    db.ref('egyeni_bowling').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            if (!hasLiveData) {
                setStatus("A Firebase 'egyeni_bowling' ága jelenleg üres (nincs adat a szerveren).", true);
            }
            return;
        }

        hasLiveData = true;
        if (data.title) {
            document.getElementById('boardTitle').innerText = String(data.title).toUpperCase();
        }

        const normalized = normalizePlayers(data.players || data);
        lastPlayers = normalized;
        renderBoard(lastPlayers);
        setStatus(`Élő adat frissítve – Játékosok száma: ${lastPlayers.length} fő`);
    }, (error) => {
        setStatus(`Firebase olvasási hiba: ${error.message}`, true);
    });
} catch (err) {
    setStatus(`Firebase inicializálási hiba: ${err.message}`, true);
}

document.getElementById('loadDemoBtn').addEventListener('click', () => {
    lastPlayers = generateDemoPlayers(24);
    renderBoard(lastPlayers);
    setStatus('24 fős tesztadat megjelenítve (dinamikus méretezés aktív).');
});

function getSetColorClass(val) {
    if (val === 0) return '';
    if (val > 150) return 'color-green';
    if (val < 120) return 'color-red';
    return 'color-yellow';
}

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function updateDynamicSizing(rowsPerCol) {
    const grid = document.getElementById('tableGrid');
    const safeRows = Math.max(rowsPerCol, 1);
    const headerHeight = 44;
    const availableBodyHeight = Math.max(grid.clientHeight - headerHeight, 200);

    const computedRowHeight = Math.min(availableBodyHeight / safeRows, 110);

    const cellFontPx = Math.max(15, Math.min(computedRowHeight * 0.44, 34));
    const totalFontPx = cellFontPx * 1.15;
    const headerFontPx = Math.max(15, Math.min(cellFontPx * 0.92, 26));
    const padY = Math.max(4, Math.min(computedRowHeight * 0.14, 18));

    const root = document.documentElement.style;
    root.setProperty('--row-height', `${computedRowHeight.toFixed(1)}px`);
    root.setProperty('--cell-font', `${cellFontPx.toFixed(1)}px`);
    root.setProperty('--total-font', `${totalFontPx.toFixed(1)}px`);
    root.setProperty('--header-font', `${headerFontPx.toFixed(1)}px`);
    root.setProperty('--cell-pad-y', `${padY.toFixed(1)}px`);
}

function renderBoard(players) {
    const sorted = [...players].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        if (b.tarol !== a.tarol) return b.tarol - a.tarol;
        if (a.ures !== b.ures) return a.ures - b.ures;
        return 0;
    });

    const splitIndex = Math.max(1, Math.ceil(sorted.length / 2));
    updateDynamicSizing(splitIndex);

    const body1 = document.getElementById('boardBody1');
    const body2 = document.getElementById('boardBody2');
    body1.innerHTML = '';
    body2.innerHTML = '';

    let currentRank = 1;

    sorted.forEach((player, index) => {
        if (index > 0) {
            const prev = sorted[index - 1];
            const isEqual = (player.total === prev.total) &&
                            (player.tarol === prev.tarol) &&
                            (player.ures === prev.ures);
            if (!isEqual) currentRank = index + 1;
        }

        const tr = document.createElement('tr');
        if (currentRank <= 3 && player.total > 0) tr.className = 'top3';

        const setsHTML = (player.sets || [0, 0, 0, 0]).map(s => {
            if (!s || s === 0) return `<td>-</td>`;
            return `<td class="${getSetColorClass(s)}">${s}</td>`;
        }).join('');

        const clubText = player.club || '-';

        tr.innerHTML = `
            <td class="rank-col">${currentRank}.</td>
            <td class="name-col" title="${player.name || ''}">${player.name || '-'}</td>
            <td class="club-col" title="${clubText}">${clubText}</td>
            <td class="total-col ${getTotalColorClass(player.total || 0)}">${player.total || 0}</td>
            ${setsHTML}
            <td class="stat-col">${player.teli ?? 0}</td>
            <td class="stat-col">${player.tarol ?? 0}</td>
            <td class="stat-col ${getUresColorClass(player.ures ?? 0)}">${player.ures ?? 0}</td>
        `;

        if (index < splitIndex) body1.appendChild(tr);
        else body2.appendChild(tr);
    });
}

window.addEventListener('resize', () => {
    if (lastPlayers.length > 0) {
        renderBoard(lastPlayers);
    }
});
</script>
</body>
</html>
