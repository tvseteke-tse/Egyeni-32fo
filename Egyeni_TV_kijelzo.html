<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Egyéni Teke - Színes Ranglista (Online - 1920x1080)</title>
<style>
    :root {
        --row-height: 50px;
        --cell-font: 1.1rem;
        --name-font: 1.05rem;
        --club-font: 0.92rem;
        --total-font: 1.22rem;
        --header-font: 0.95rem;
        --cell-pad-y: 4px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #00122e;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        overflow: hidden;
    }

    body {
        padding: 10px;
    }

    .board-container {
        width: 100%;
        height: 100%;
        background: #001c47;
        border: 3px solid #0044aa;
        border-radius: 12px;
        padding: 14px 18px;
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.7);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    h1 {
        text-align: center;
        margin: 0 0 10px 0;
        font-size: 2.1rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 255, 0, 0.5);
        flex-shrink: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .table-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 18px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
        table-layout: fixed;
    }

    thead tr {
        height: 40px;
    }

    th {
        color: #ffff00;
        border-bottom: 3px solid #0044aa;
        padding: 6px 2px;
        font-size: var(--header-font);
        background-color: #001536;
        white-space: nowrap;
        text-align: center;
        overflow: hidden;
    }

    th.name-col, th.club-col {
        text-align: left;
    }

    tbody tr {
        height: var(--row-height);
        transition: background-color 0.2s ease;
    }

    tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.035); }
    tbody tr:nth-child(odd) { background-color: rgba(0, 0, 0, 0.22); }
    tbody tr:hover { background-color: rgba(0, 85, 204, 0.3) !important; }

    td {
        padding: var(--cell-pad-y) 2px;
        text-align: center;
        border-bottom: 1px solid #003380;
        font-size: var(--cell-font);
        font-weight: bold;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
    }

    .rank-col {
        width: 4.5%;
        color: #ffffff;
        font-weight: bold;
        text-align: center;
    }

    /* Teljes név kiírása levágás nélkül a saját oszlopán belül */
    .name-col {
        width: 21.5%;
        text-align: left;
        font-family: sans-serif;
        color: #ffff00;
        font-size: var(--name-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        padding-right: 6px;
    }

    /* Teljes egyesületnév kiírása levágás nélkül */
    .club-col {
        width: 19%;
        text-align: left;
        font-family: sans-serif;
        color: #58a6ff;
        font-weight: normal;
        font-size: var(--club-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        padding-right: 6px;
    }

    .total-col {
        width: 8%;
        font-weight: bold;
        font-size: var(--total-font);
    }

    .set-col {
        width: 5.75%;
    }

    .stat-col {
        width: 8%;
        color: #8b949e;
        font-size: var(--cell-font);
    }

    .color-green { color: #00ff66 !important; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }

    tr.top3 { background-color: rgba(0, 68, 170, 0.45) !important; }
    tr.top3:nth-child(even) { background-color: rgba(0, 80, 195, 0.5) !important; }
    tr.top3 .rank-col { color: #ffff00; font-size: calc(var(--cell-font) * 1.06); }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <h1 id="boardTitle">EGYÉNI BAJNOKSÁG</h1>
    <div class="table-grid" id="tableGrid">
        <table>
            <thead>
                <tr>
                    <th class="rank-col">#</th>
                    <th class="name-col">Név</th>
                    <th class="club-col">Egyesület</th>
                    <th class="total-col">Össz.</th>
                    <th class="set-col">S1</th>
                    <th class="set-col">S2</th>
                    <th class="set-col">S3</th>
                    <th class="set-col">S4</th>
                    <th class="stat-col">Teli</th>
                    <th class="stat-col">Tarol</th>
                    <th class="stat-col">Üres</th>
                </tr>
            </thead>
            <tbody id="boardBody1"></tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th class="rank-col">#</th>
                    <th class="name-col">Név</th>
                    <th class="club-col">Egyesület</th>
                    <th class="total-col">Össz.</th>
                    <th class="set-col">S1</th>
                    <th class="set-col">S2</th>
                    <th class="set-col">S3</th>
                    <th class="set-col">S4</th>
                    <th class="stat-col">Teli</th>
                    <th class="stat-col">Tarol</th>
                    <th class="stat-col">Üres</th>
                </tr>
            </thead>
            <tbody id="boardBody2"></tbody>
        </table>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let lastPlayers = [];

db.ref('egyeni_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.title) document.getElementById('boardTitle').innerText = data.title.toUpperCase();
        if (data.players) {
            lastPlayers = Array.isArray(data.players) ? data.players : Object.values(data.players);
            renderBoard(lastPlayers);
        }
    }
});

function getSetColorClass(val) {
    if (val === 0) return '';
    if (val > 150) return 'color-green';
    if (val < 120) return 'color-red';
    return 'color-yellow';
}

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function updateDynamicSizing(players, rowsPerCol) {
    const grid = document.getElementById('tableGrid');
    const safeRows = Math.max(rowsPerCol, 1);
    const theadHeight = 42;
    const availableBodyHeight = Math.max(grid.clientHeight - theadHeight - 2, 180);

    const computedRowHeight = Math.min(availableBodyHeight / safeRows, 100);
    const heightDrivenFont = computedRowHeight * 0.36;

    const maxNameLen = players.reduce((max, p) => Math.max(max, String(p.name || '').length), 10);
    const maxClubLen = players.reduce((max, p) => Math.max(max, String(p.club || '').length), 10);

    const halfGridWidth = Math.max(grid.clientWidth / 2 - 9, 360);
    const nameColPx = halfGridWidth * 0.215 - 8;
    const clubColPx = halfGridWidth * 0.19 - 8;

    const nameByWidthPx = nameColPx / Math.max(maxNameLen * 0.56, 6);
    const clubByWidthPx = clubColPx / Math.max(maxClubLen * 0.54, 6);

    const nameFontPx = Math.max(11, Math.min(heightDrivenFont, nameByWidthPx, 25));
    const clubFontPx = Math.max(10, Math.min(heightDrivenFont * 0.92, clubByWidthPx, 22));
    const cellFontPx = Math.max(13, Math.min(heightDrivenFont, 25));
    const totalFontPx = cellFontPx * 1.12;
    const headerFontPx = Math.max(11, Math.min(cellFontPx * 0.78, 19));
    const padY = Math.max(2, Math.min(computedRowHeight * 0.08, 12));

    const root = document.documentElement.style;
    root.setProperty('--row-height', `${computedRowHeight.toFixed(1)}px`);
    root.setProperty('--cell-font', `${cellFontPx.toFixed(1)}px`);
    root.setProperty('--name-font', `${nameFontPx.toFixed(1)}px`);
    root.setProperty('--club-font', `${clubFontPx.toFixed(1)}px`);
    root.setProperty('--total-font', `${totalFontPx.toFixed(1)}px`);
    root.setProperty('--header-font', `${headerFontPx.toFixed(1)}px`);
    root.setProperty('--cell-pad-y', `${padY.toFixed(1)}px`);
}

function renderBoard(players) {
    const sorted = [...players].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        if (b.tarol !== a.tarol) return b.tarol - a.tarol;
        if (a.ures !== b.ures) return a.ures - b.ures;
        return 0;
    });

    const splitIndex = Math.max(1, Math.ceil(sorted.length / 2));
    updateDynamicSizing(sorted, splitIndex);

    const body1 = document.getElementById('boardBody1');
    const body2 = document.getElementById('boardBody2');
    body1.innerHTML = '';
    body2.innerHTML = '';

    let currentRank = 1;

    sorted.forEach((player, index) => {
        if (index > 0) {
            const prev = sorted[index - 1];
            const isEqual = (player.total === prev.total) &&
                            (player.tarol === prev.tarol) &&
                            (player.ures === prev.ures);
            if (!isEqual) currentRank = index + 1;
        }

        const tr = document.createElement('tr');
