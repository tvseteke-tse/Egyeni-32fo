<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Egyéni Teke - Színes Ranglista (Online - 1920x1080)</title>
<style>
    :root {
        --row-height: 58px;
        --cell-font: 1.25rem;
        --name-font: 1.25rem;
        --club-font: 1.05rem;
        --total-font: 1.4rem;
        --header-font: 1.1rem;
        --cell-pad-y: 8px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #00122e;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        overflow: hidden;
    }

    body {
        padding: 12px;
    }

    .board-container {
        width: 100%;
        height: 100%;
        background: #001c47;
        border: 3px solid #0044aa;
        border-radius: 12px;
        padding: 16px 22px;
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.7);
        display: flex;
        flex-direction: column;
    }

    h1 {
        text-align: center;
        margin: 0 0 14px 0;
        font-size: 2.3rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 255, 0, 0.5);
        flex-shrink: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .table-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
    }

    table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
        table-layout: auto;
    }

    thead {
        height: 46px;
    }

    th {
        color: #ffff00;
        border-bottom: 3px solid #0044aa;
        padding: 8px 6px;
        font-size: var(--header-font);
        background-color: #001536;
        white-space: nowrap;
        text-align: center;
    }

    th.name-col, th.club-col {
        text-align: left;
    }

    tbody tr {
        height: var(--row-height);
        transition: background-color 0.2s ease;
    }

    /* Sorok elkülönítése */
    tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.035); }
    tbody tr:nth-child(odd) { background-color: rgba(0, 0, 0, 0.22); }
    tbody tr:hover { background-color: rgba(0, 85, 204, 0.3) !important; }

    td {
        padding: var(--cell-pad-y) 6px;
        text-align: center;
        border-bottom: 1px solid #003380;
        font-size: var(--cell-font);
        font-weight: bold;
        line-height: 1.15;
        white-space: nowrap;
    }

    .rank-col {
        width: 48px;
        color: #ffffff;
        font-weight: bold;
        text-align: center;
    }

    /* Teljes név megjelenítés levágás nélkül */
    .name-col {
        text-align: left;
        font-family: sans-serif;
        color: #ffff00;
        font-size: var(--name-font);
        white-space: nowrap;
        overflow: visible;
        text-overflow: clip;
        padding-right: 12px;
    }

    .club-col {
        text-align: left;
        font-family: sans-serif;
        color: #58a6ff;
        font-weight: normal;
        font-size: var(--club-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 210px;
        padding-right: 10px;
    }

    .total-col {
        width: 78px;
        font-weight: bold;
        font-size: var(--total-font);
    }

    .set-col {
        width: 50px;
    }

    .stat-col {
        width: 62px;
        color: #8b949e;
        font-size: var(--cell-font);
    }

    .color-green { color: #00ff66 !important; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }

    tr.top3 { background-color: rgba(0, 68, 170, 0.45) !important; }
    tr.top3:nth-child(even) { background-color: rgba(0, 80, 195, 0.5) !important; }
    tr.top3 .rank-col { color: #ffff00; font-size: calc(var(--cell-font) * 1.08); }
</style>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

let lastPlayers = [];

function normalizePlayers(rawPlayers) {
    if (!rawPlayers) return [];

    const list = Array.isArray(rawPlayers)
        ? rawPlayers.filter(Boolean)
        : (typeof rawPlayers === 'object' ? Object.values(rawPlayers).filter(Boolean) : []);

    return list.map((p) => {
        let sets = [0, 0, 0, 0];
        if (Array.isArray(p.sets)) {
            sets = [0, 1, 2, 3].map((i) => Number(p.sets[i]) || 0);
        } else if (p.sets && typeof p.sets === 'object') {
            sets = [0, 1, 2, 3].map((i) => Number(p.sets[i] ?? p.sets[`s${i + 1}`] ?? p.sets[`S${i + 1}`]) || 0);
        } else {
            sets = [
                Number(p.s1 ?? p.S1) || 0,
                Number(p.s2 ?? p.S2) || 0,
                Number(p.s3 ?? p.S3) || 0,
                Number(p.s4 ?? p.S4) || 0
            ];
        }

        const sumSets = sets.reduce((acc, v) => acc + v, 0);
        const total = (p.total !== undefined && p.total !== null && p.total !== '')
            ? (Number(p.total) || 0)
            : sumSets;

        return {
            name: p.name || p.nev || '-',
            club: p.club || p.egyesulet || '-',
            total,
            sets,
            teli: Number(p.teli ?? p.full ?? 0) || 0,
            tarol: Number(p.tarol ?? p.clean ?? 0) || 0,
            ures: Number(p.ures ?? p.error ?? 0) || 0
        };
    });
}

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('egyeni_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    if (data.title) {
        document.getElementById('boardTitle').innerText = String(data.title).toUpperCase();
    }

    lastPlayers = normalizePlayers(data.players || data);
    renderBoard(lastPlayers);
});

function getSetColorClass(val) {
    if (val === 0) return '';
    if (val > 150) return 'color-green';
    if (val < 120) return 'color-red';
    return 'color-yellow';
}

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function fitBoardToContainer(players, rowsPerCol) {
    const grid = document.getElementById('tableGrid');
    const safeRows = Math.max(rowsPerCol, 1);

    const availableBodyHeight = Math.max(grid.clientHeight - headerHeight, 240);

    const maxNameLen = players.reduce((max, p) => Math.max(max, String(p.name || '').length), 10);
    const maxClubLen = players.reduce((max, p) => Math.max(max, String(p.club || '').length), 8);

    const singleColWidth = Math.max(grid.clientWidth / 2 - 12, 400);
    // Fixebb szám/statisztikai oszlopok kb. 455px-t foglalnak el
    const fixedColsWidth = 455;
    const textBudget = Math.max(singleColWidth - fixedColsWidth, 180);

    // Név és egyesület arányos szélesség-kerete
    const nameShare = textBudget * 0.58;
    const clubShare = textBudget * 0.42;

    // Név betűméret úgy, hogy a leghosszabb név is kiférjen levágás nélkül
    const nameByWidthPx = (nameShare / Math.max(maxNameLen * 0.56, 6));
    const computedRowHeight = Math.min(availableBodyHeight / safeRows, 120);
    const heightDrivenFont = computedRowHeight * 0.
