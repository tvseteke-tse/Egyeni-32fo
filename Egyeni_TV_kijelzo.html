<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Egyéni Teke - Színes Ranglista (Online - 1920x1080)</title>
<style>
    :root {
        --row-height: 50px;
        --cell-font: 1.1rem;
        --name-font: 1.05rem;
        --club-font: 0.92rem;
        --total-font: 1.22rem;
        --header-font: 0.95rem;
        --cell-pad-y: 4px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #00122e;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        overflow: hidden;
    }

    body {
        padding: 10px;
    }

    .board-container {
        width: 100%;
        height: 100%;
        background: #001c47;
        border: 3px solid #0044aa;
        border-radius: 12px;
        padding: 14px 18px;
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.7);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    h1 {
        text-align: center;
        margin: 0 0 10px 0;
        font-size: 2.1rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 255, 0, 0.5);
        flex-shrink: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .table-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 18px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
        table-layout: fixed;
    }

    thead tr {
        height: 40px;
    }

    th {
        color: #ffff00;
        border-bottom: 3px solid #0044aa;
        padding: 6px 2px;
        font-size: var(--header-font);
        background-color: #001536;
        white-space: nowrap;
        text-align: center;
        overflow: hidden;
    }

    th.name-col, th.club-col {
        text-align: left;
    }

    tbody tr {
        height: var(--row-height);
        transition: background-color 0.2s ease;
    }

    tbody tr:nth-child(even) { background-color: rgba(255, 255, 255, 0.035); }
    tbody tr:nth-child(odd) { background-color: rgba(0, 0, 0, 0.22); }
    tbody tr:hover { background-color: rgba(0, 85, 204, 0.3) !important; }

    td {
        padding: var(--cell-pad-y) 2px;
        text-align: center;
        border-bottom: 1px solid #003380;
        font-size: var(--cell-font);
        font-weight: bold;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
    }

    .rank-col {
        width: 4.5%;
        color: #ffffff;
        font-weight: bold;
        text-align: center;
    }

    .name-col {
        width: 21.5%;
        text-align: left;
        font-family: sans-serif;
        color: #ffff00;
        font-size: var(--name-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        padding-right: 6px;
    }

    .club-col {
        width: 19%;
        text-align: left;
        font-family: sans-serif;
        color: #58a6ff;
        font-weight: normal;
        font-size: var(--club-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
        padding-right: 6px;
    }

    .total-col {
        width: 8%;
        font-weight: bold;
        font-size: var(--total-font);
    }

    .set-col {
        width: 5.75%;
    }

    .stat-col {
        width: 8%;
        color: #8b949e;
        font-size: var(--cell-font);
    }

    .color-green { color: #00ff66 !important; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }

    tr.top3 { background-color: rgba(0, 68, 170, 0.45) !important; }
    tr.top3:nth-child(even) { background-color: rgba(0, 80, 195, 0.5) !important; }
    tr.top3 .rank-col { color: #ffff00; font-size: calc(var(--cell-font) * 1.06); }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</head>
