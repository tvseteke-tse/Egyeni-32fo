<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Összetett Verseny Kijelző</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4caf50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
        }
        th {
            background-color: #2c2c2c;
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
        }
        tr {
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.2s;
        }
        tr:hover {
            background-color: #282828;
        }
        .rank {
            font-weight: bold;
            width: 60px;
            text-align: center;
            color: #ffca28;
        }
        .num-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .total-score {
            font-weight: bold;
            color: #4caf50;
            font-size: 1.1rem;
        }
        .top-1 { background-color: rgba(255, 215, 0, 0.1); }
        .top-2 { background-color: rgba(192, 192, 192, 0.1); }
        .top-3 { background-color: rgba(205, 127, 50, 0.1); }
    </style>
</head>
<body>

    <h1>Összetett Verseny Eredmények</h1>

    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Név</th>
                <th>Egyesület</th>
                <th class="num-col">Egyéni (fa)</th>
                <th class="num-col">Sprint Max (fa)</th>
                <th class="num-col">Összetett (fa)</th>
            </tr>
        </thead>
        <tbody id="standings-body">
            </tbody>
    </table>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Konfiguráció (Ide másold be a meglévő Firebase configodat!)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const standingsBody = document.getElementById('standings-body');

        // Valós idejű adatfigyelés az 'osszetett_eredmenyek' csomóponton
        db.ref('osszetett_eredmenyek').on('value', (snapshot) => {
            const data = snapshot.val();
            standingsBody.innerHTML = '';

            if (!data) {
                standingsBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nincs megjeleníthető adat</td></tr>';
                return;
            }

            // Objektum tömbbé alakítása a rendezéshez
            let list = [];
            Object.keys(data).forEach(key => {
                const player = data[key];
                const egyeni = parseInt(player.egyeni_fa) || 0;
                const sprint = parseInt(player.sprint_max_fa) || 0;
                const osszetett = egyeni + sprint;

                list.push({
                    nev: player.nev || 'Névtelen',
                    egyesulet: player.egyesulet || '-',
                    egyeni: egyeni,
                    sprint: sprint,
                    osszetett: osszetett
                });
            });

            // Rendezés összetett fa alapján csökkenő sorrendben
            list.sort((a, b) => b.osszetett - a.osszetett);

            // Táblázat feltöltése
            list.forEach((player, index) => {
                const rank = index + 1;
                let rowClass = '';
                if (rank === 1) rowClass = 'top-1';
                if (rank === 2) rowClass = 'top-2';
                if (rank === 3) rowClass = 'top-3';

                const tr = document.createElement('tr');
                if (rowClass) tr.classList.add(rowClass);

                tr.innerHTML = `
                    <td class="rank">${rank}.</td>
                    <td><strong>${player.nev}</strong></td>
                    <td>${player.egyesulet}</td>
                    <td class="num-col">${player.egyeni}</td>
                    <td class="num-col">${player.sprint}</td>
                    <td class="num-col total-score">${player.osszetett}</td>
                `;
                standingsBody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
