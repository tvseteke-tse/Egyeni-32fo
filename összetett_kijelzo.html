<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Összetett Verseny Kijelző</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4caf50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
        }
        th {
            background-color: #2c2c2c;
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
        }
        tr {
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.2s;
        }
        tr:hover {
            background-color: #282828;
        }
        .rank {
            font-weight: bold;
            width: 60px;
            text-align: center;
            color: #ffca28;
        }
        .num-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .total-score {
            font-weight: bold;
            color: #4caf50;
            font-size: 1.1rem;
        }
        .top-1 { background-color: rgba(255, 215, 0, 0.1); }
        .top-2 { background-color: rgba(192, 192, 192, 0.1); }
        .top-3 { background-color: rgba(205, 127, 50, 0.1); }
    </style>
</head>
<body>

    <h1>Összetett Verseny Eredmények</h1>

    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Név</th>
                <th>Egyesület</th>
                <th class="num-col">Egyéni (fa)</th>
                <th class="num-col">Sprint Max (fa)</th>
                <th class="num-col">Összetett (fa)</th>
            </tr>
        </thead>
        <tbody id="standings-body">
            <tr><td colspan="6" style="text-align:center;">Adatok betöltése...</td></tr>
        </tbody>
    </table>

    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. EGYÉNI VERSENY FIREBASE CONFIG
        const egyeniConfig = {
            apiKey: "EGYENI_API_KEY",
            authDomain: "EGYENI_PROJECT.firebaseapp.com",
            databaseURL: "https://EGYENI_PROJECT-default-rtdb.firebaseio.com",
            projectId: "EGYENI_PROJECT",
            storageBucket: "EGYENI_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // 2. SPRINT VERSENY FIREBASE CONFIG
        const sprintConfig = {
            apiKey: "SPRINT_API_KEY",
            authDomain: "SPRINT_PROJECT.firebaseapp.com",
            databaseURL: "https://SPRINT_PROJECT-default-rtdb.firebaseio.com",
            projectId: "SPRINT_PROJECT",
            storageBucket: "SPRINT_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // Két Firebase alkalmazás inicializálása külön nevekkel
        const egyeniApp = firebase.initializeApp(egyeniConfig, "egyeniApp");
        const sprintApp = firebase.initializeApp(sprintConfig, "sprintApp");

        const egyeniDb = firebase.database(egyeniApp);
        const sprintDb = firebase.database(sprintApp);

        const standingsBody = document.getElementById('standings-body');

        let egyeniData = {};
        let sprintData = {};

        // Adatok feldolgozása és összevonása
        function updateCombinedStandings() {
            const playersMap = {}; // Játékosok összegzett adatai név szerint összefésülve

            // 1. Egyéni adatok beolvasása
            if (egyeniData) {
                Object.keys(egyeniData).forEach(key => {
                    const p = egyeniData[key];
                    const nev = p.nev || p.name;
                    if (!nev) return;

                    // Egyéni fa megkeresése (módosítsd a kulcsnevet, ha a DB-ben más pl: ossz_fa, teljes_fa)
                    const egyeniFa = parseInt(p.fa || p.egyeni_fa || p.osszesen) || 0;
                    const egyesulet = p.egyesulet || p.klub || '-';

                    playersMap[nev] = {
                        nev: nev,
                        egyesulet: egyesulet,
                        egyeniFa: egyeniFa,
                        sprintMaxFa: 0
                    };
                });
            }

            // 2. Sprint adatok beolvasása és a LEGJOBB (max) fa kiválasztása (SV nélkül)
            if (sprintData) {
                Object.keys(sprintData).forEach(key => {
                    const matchOrPlayer = sprintData[key];

                    // Támogatja, ha a sprint DB meccsekre vagy ha játékosokra van strukturálva:
                    const nev = matchOrPlayer.nev || matchOrPlayer.jatek_nev;
                    
                    // A sprint normál fái (SV / Sudden Victory nélkül!)
                    const sprintFa = parseInt(matchOrPlayer.sprint_fa || matchOrPlayer.fa_sv_nelkul || matchOrPlayer.szett_fak) || 0;

                    if (nev) {
                        if (!playersMap[nev]) {
                            playersMap[nev] = {
                                nev: nev,
                                egyesulet: matchOrPlayer.egyesulet || '-',
                                egyeniFa: 0,
                                sprintMaxFa: sprintFa
                            };
                        } else {
                            // Csak akkor frissítjük, ha ez az eddigi legjobb sprint eredménye
                            if (sprintFa > playersMap[nev].sprintMaxFa) {
                                playersMap[nev].sprintMaxFa = sprintFa;
                            }
                        }
                    }
                });
            }

            // Tömbbe rendezés
            let combinedList = Object.values(playersMap).map(p => {
                return {
                    ...p,
                    osszetettFa: p.egyeniFa + p.sprintMaxFa
                };
            });

            // Rendezés Összetett Fa alapján csökkenő sorrendben
            combinedList.sort((a, b) => b.osszetettFa - a.osszetettFa);

            // Táblázat kirajzolása
            standingsBody.innerHTML = '';
            if (combinedList.length === 0) {
                standingsBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nincs megjeleníthető adat</td></tr>';
                return;
            }

            combinedList.forEach((player, index) => {
                const rank = index + 1;
                let rowClass = '';
                if (rank === 1) rowClass = 'top-1';
                if (rank === 2) rowClass = 'top-2';
                if (rank === 3) rowClass = 'top-3';

                const tr = document.createElement('tr');
                if (rowClass) tr.classList.add(rowClass);

                tr.innerHTML = `
                    <td class="rank">${rank}.</td>
                    <td><strong>${player.nev}</strong></td>
                    <td>${player.egyesulet}</td>
                    <td class="num-col">${player.egyeniFa}</td>
                    <td class="num-col">${player.sprintMaxFa}</td>
                    <td class="num-col total-score">${player.osszetettFa}</td>
                `;
                standingsBody.appendChild(tr);
            });
        }

        // Egyéni DB figyelése
        egyeniDb.ref('eredmenyek').on('value', (snapshot) => {
            egyeniData = snapshot.val() || {};
            updateCombinedStandings();
        });

        // Sprint DB figyelése
        sprintDb.ref('sprint_eredmenyek').on('value', (snapshot) => {
            sprintData = snapshot.val() || {};
            updateCombinedStandings();
        });
    </script>
</body>
</html>
