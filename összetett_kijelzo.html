<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Összetett Verseny Kijelző</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4caf50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
        }
        th {
            background-color: #2c2c2c;
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid #333;
        }
        tr {
            border-bottom: 1px solid #2a2a2a;
            transition: background 0.2s;
        }
        tr:hover {
            background-color: #282828;
        }
        .rank {
            font-weight: bold;
            width: 60px;
            text-align: center;
            color: #ffca28;
        }
        .num-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .total-score {
            font-weight: bold;
            color: #4caf50;
            font-size: 1.1rem;
        }
        .top-1 { background-color: rgba(255, 215, 0, 0.1); }
        .top-2 { background-color: rgba(192, 192, 192, 0.1); }
        .top-3 { background-color: rgba(205, 127, 50, 0.1); }
    </style>
</head>
<body>

    <h1>Összetett Verseny Eredmények</h1>

    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Név</th>
                <th>Egyesület</th>
                <th class="num-col">Egyéni (fa)</th>
                <th class="num-col">Sprint Max (fa)</th>
                <th class="num-col">Összetett (fa)</th>
            </tr>
        </thead>
        <tbody id="standings-body">
            <tr><td colspan="6" style="text-align:center;">Adatok betöltése...</td></tr>
        </tbody>
    </table>

    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "teke-eredmenyek.firebaseapp.com",
            databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
            projectId: "teke-eredmenyek",
            storageBucket: "teke-eredmenyek.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const standingsBody = document.getElementById('standings-body');

        let egyeniData = {};
        let sprintMatches = {};

        function updateCombinedStandings() {
            const playersMap = {};

            // 1. EGYÉNI ADATOK FELDOLGOZÁSA (`egyeni_bowling/players`)
            if (egyeniData) {
                Object.keys(egyeniData).forEach(key => {
                    const p = egyeniData[key];
                    const nev = p.nev || p.name;
                    if (!nev) return;

                    const egyeniFa = parseInt(p.fa || p.osszesen || p.total) || 0;
                    const egyesulet = p.egyesulet || p.klub || '-';

                    playersMap[nev] = {
                        nev: nev,
                        egyesulet: egyesulet,
                        egyeniFa: egyeniFa,
                        sprintMaxFa: 0
                    };
                });
            }

            // 2. SPRINT ADATOK FELDOLGOZÁSA (`torna_32` meccsei)
            if (sprintMatches) {
                Object.keys(sprintMatches).forEach(matchKey => {
                    if (matchKey === 'title') return; // Cím mező átugrása
                    const m = sprintMatches[matchKey];

                    // Játékos 1 adatai a meccsből
                    if (m.p1_name) {
                        const nev1 = m.p1_name;
                        // Csak a rendes szettek fái (SV nélkül!)
                        const s1 = parseInt(m.p1_s1_fa) || 0;
                        const s2 = parseInt(m.p1_s2_fa) || 0;
                        const meccsszetFa = s1 + s2;

                        if (!playersMap[nev1]) {
                            playersMap[nev1] = { nev: nev1, egyesulet: m.p1_club || '-', egyeniFa: 0, sprintMaxFa: meccsszetFa };
                        } else {
                            if (meccsszetFa > playersMap[nev1].sprintMaxFa) {
                                playersMap[nev1].sprintMaxFa = meccsszetFa;
                            }
                        }
                    }

                    // Játékos 2 adatai a meccsből
                    if (m.p2_name) {
                        const nev2 = m.p2_name;
                        const s1 = parseInt(m.p2_s1_fa) || 0;
                        const s2 = parseInt(m.p2_s2_fa) || 0;
                        const meccsszetFa = s1 + s2;

                        if (!playersMap[nev2]) {
                            playersMap[nev2] = { nev: nev2, egyesulet: m.p2_club || '-', egyeniFa: 0, sprintMaxFa: meccsszetFa };
                        } else {
                            if (meccsszetFa > playersMap[nev2].sprintMaxFa) {
                                playersMap[nev2].sprintMaxFa = meccsszetFa;
                            }
                        }
                    }
                });
            }

            // 3. ÖSSZETETT TÖMB ÉS RENDEZÉS
            let combinedList = Object.values(playersMap).map(p => ({
                ...p,
                osszetettFa: p.egyeniFa + p.sprintMaxFa
            }));

            combinedList.sort((a, b) => b.osszetettFa - a.osszetettFa);

            // 4. KIJELZŐ FRISSÍTÉSE
            standingsBody.innerHTML = '';
            if (combinedList.length === 0) {
                standingsBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nincs megjeleníthető adat</td></tr>';
                return;
            }

            combinedList.forEach((player, index) => {
                const rank = index + 1;
                let rowClass = '';
                if (rank === 1) rowClass = 'top-1';
                if (rank === 2) rowClass = 'top-2';
                if (rank === 3) rowClass = 'top-3';

                const tr = document.createElement('tr');
                if (rowClass) tr.classList.add(rowClass);

                tr.innerHTML = `
                    <td class="rank">${rank}.</td>
                    <td><strong>${player.nev}</strong></td>
                    <td>${player.egyesulet}</td>
                    <td class="num-col">${player.egyeniFa}</td>
                    <td class="num-col">${player.sprintMaxFa}</td>
                    <td class="num-col total-score">${player.osszetettFa}</td>
                `;
                standingsBody.appendChild(tr);
            });
        }

        // Egyéni eredmények figyelése
        db.ref('egyeni_bowling/players').on('value', (snapshot) => {
            egyeniData = snapshot.val() || {};
            updateCombinedStandings();
        });

        // Sprint meccsek figyelése (torna_32)
        db.ref('torna_32').on('value', (snapshot) => {
            sprintMatches = snapshot.val() || {};
            updateCombinedStandings();
        });
    </script>
</body>
</html>
