<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egyéni Teke - Adminisztráció (Online)</title>
<style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
    .header-panel { margin-bottom: 20px; text-align: center; }
    .header-panel input {
        font-size: 1.4rem; padding: 8px 12px; width: 80%; max-width: 500px;
        background: #2a2a2a; border: 2px solid #3fb950; color: #ffff00;
        font-weight: bold; border-radius: 6px; text-align: center;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 6px; border: 1px solid #333; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: #8b949e; }
    .row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    input[type="text"].p-name, input[type="text"].p-club { 
        flex: 1; background: #2a2a2a; border: 1px solid #444; color: white; padding: 6px; border-radius: 4px; font-weight: bold; 
    }
    input[type="text"].p-club {
        color: #58a6ff; font-weight: normal; font-size: 0.9rem;
    }
    .stats-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #252525; padding: 6px; border-radius: 4px; }
    .set-box { display: flex; flex-direction: column; gap: 3px; background: #1a1a1a; padding: 4px; border-radius: 4px; text-align: center; }
    .set-box label { font-size: 0.75rem; color: #3fb950; font-weight: bold; }
    .set-box input { width: 90%; background: #2a2a2a; border: 1px solid #444; color: white; padding: 4px 0; text-align: center; border-radius: 3px; font-size: 0.85rem; margin: 0 auto; }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header-panel">
    <input type="text" id="tournamentTitle" value="Egyéni Bajnokság" placeholder="Bajnokság / Verseny Neve" oninput="sendData()">
</div>

<div class="grid" id="playersContainer"></div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

const totalPlayers = 32;

function init() {
    const container = document.getElementById('playersContainer');
    container.innerHTML = '';
    
    // 1. A kártyák HTML vázának létrehozása
    for (let i = 0; i < totalPlayers; i++) {
        container.innerHTML += `
            <div class="card" data-idx="${i}">
                <div class="card-header">
                    <span>#${i + 1} Játékos</span>
                </div>
                <div class="row">
                    <input type="text" class="p-name" placeholder="Játékos neve" oninput="sendData()">
                    <input type="text" class="p-club" placeholder="Egyesület / Klub" oninput="sendData()">
                </div>
                <div class="stats-inputs">
                    ${[0,1,2,3].map(s => `
                        <div class="set-box">
                            <label>S${s+1}</label>
                            <input type="number" class="p-teli${s}" placeholder="Teli" oninput="sendData()">
                            <input type="number" class="p-tarol${s}" placeholder="Tar" oninput="sendData()">
                            <input type="number" class="p-ures${s}" placeholder="Üres" oninput="sendData()">
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // 2. Adatok lekérése a Firebase-ből és betöltése a mezőkbe
    db.ref('egyeni_bowling').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // Cím frissítése
        const titleInput = document.getElementById('tournamentTitle');
        if (document.activeElement !== titleInput && data.title) {
            titleInput.value = data.title;
        }

        // Játékosok és egyesületek betöltése
        if (data.players && Array.isArray(data.players)) {
            const cards = document.querySelectorAll('.card');
            
            data.players.forEach((player, idx) => {
                if (cards[idx]) {
                    const card = cards[idx];
                    const nameInput = card.querySelector('.p-name');
                    const clubInput = card.querySelector('.p-club');
                    
                    // Név frissítése (ha nem abba gépel éppen)
                    if (document.activeElement !== nameInput) {
                        nameInput.value = (player.name && !player.name.startsWith('Játékos ')) ? player.name : '';
                    }

                    // Egyesület frissítése (ha nem abba gépel éppen)
                    if (document.activeElement !== clubInput) {
                        clubInput.value = player.club || '';
                    }

                    // Szettek frissítése
                    for (let s = 0; s < 4; s++) {
                        const teliInp = card.querySelector(`.p-teli${s}`);
                        const tarolInp = card.querySelector(`.p-tarol${s}`);
                        const uresInp = card.querySelector(`.p-ures${s}`);

                        if (player.rawSets && player.rawSets[s]) {
                            if (document.activeElement !== teliInp) teliInp.value = player.rawSets[s].teli || '';
                            if (document.activeElement !== tarolInp) tarolInp.value = player.rawSets[s].tarol || '';
                            if (document.activeElement !== uresInp) uresInp.value = player.rawSets[s].ures || '';
                        }
                    }
                }
            });
        }
    });
}

function sendData() {
    const title = document.getElementById('tournamentTitle').value || 'Egyéni Bajnokság';
    const players = [];
    const cards = document.querySelectorAll('.card');

    cards.forEach((card, idx) => {
        const name = card.querySelector('.p-name').value;
        const club = card.querySelector('.p-club').value;
        
        let totalTeli = 0, totalTarol = 0, totalUres = 0;
        const sets = [];
        const rawSets = [];

        for (let s = 0; s < 4; s++) {
            const teliVal = card.querySelector(`.p-teli${s}`).value;
            const tarolVal = card.querySelector(`.p-tarol${s}`).value;
            const uresVal = card.querySelector(`.p-ures${s}`).value;

            const teli = parseInt(teliVal) || 0;
            const tarol = parseInt(tarolVal) || 0;
            const ures = parseInt(uresVal) || 0;

            totalTeli += teli;
            totalTarol += tarol;
            totalUres += ures;
            sets.push(teli + tarol);

            rawSets.push({
                teli: teliVal !== '' ? teli : '',
                tarol: tarolVal !== '' ? tarol : '',
                ures: uresVal !== '' ? ures : ''
            });
        }

        players.push({
            id: idx + 1,
            name: name || `Játékos ${idx + 1}`,
            club: club || '', // Egyesület mentése
            sets: sets,
            rawSets: rawSets,
            teli: totalTeli,
            tarol: totalTarol,
            ures: totalUres,
            total: totalTeli + totalTarol
        });
    });

    db.ref('egyeni_bowling').set({
        title: title,
        players: players
    });
}

init();
</script>
</body>
</html>
