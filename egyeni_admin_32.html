<style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #ffffff; padding: 15px; margin: 0; }
    .header-panel { 
        margin-bottom: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 12px; 
        flex-wrap: wrap;
    }
    .header-panel input {
        font-size: 1.4rem; padding: 8px 12px; width: 70%; max-width: 500px;
        background: #2a2a2a; border: 2px solid #3fb950; color: #ffff00;
        font-weight: bold; border-radius: 6px; text-align: center;

        font-size: 1.1rem;
        padding: 10px 18px;

        cursor: pointer;
        transition: background 0.2s;

        background: #b62324;
    }

        gap: 12px; 
        width: 100%;
    }
    .card { 
        background: #1e1e1e; 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid #333; 
    }
    .card-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 8px; 
        font-weight: bold; 
        color: #8b949e; 
    }
    .delete-player-btn {
        background: transparent;
        border: 1px solid #444;
        color: #f85149;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .delete-player-btn:hover {
        background: #da3633;
        border-color: #da3633;
        color: #ffffff;
    }
    .row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    input[type="text"].p-name, input[type="text"].p-club { 
        flex: 1; min-width: 0; background: #2a2a2a; border: 1px solid #444; color: #ffffff; padding: 6px; border-radius: 4px; font-weight: bold; 
    }
    input[type="text"].p-club {
        color: #58a6ff; font-weight: normal; font-size: 0.9rem;
    }
    .stats-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #252525; padding: 6px; border-radius: 4px; }
    .set-box { display: flex; flex-direction: column; gap: 3px; background: #1a1a1a; padding: 4px; border-radius: 4px; text-align: center; }
    .set-box label { font-size: 0.75rem; color: #3fb950; font-weight: bold; }
    .set-box input { width: 100%; max-width: 70px; background: #2a2a2a; border: 1px solid #444; color: #ffffff; padding: 4px 2px; text-align: center; border-radius: 3px; font-size: 0.85rem; margin: 0 auto; }
    #statusBar { margin-top: 16px; font-size: 0.85rem; color: #8b949e; text-align: center; }
</style>
