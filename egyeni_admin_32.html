<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egyéni Teke - Adminisztráció (Online)</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #121212; color: #ffffff; padding: 15px; margin: 0; }
    .header-panel { 
        margin-bottom: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 10px; 
        flex-wrap: wrap;
    }
    .header-panel input {
        font-size: 1.4rem; padding: 8px 12px; width: 70%; max-width: 460px;
        background: #2a2a2a; border: 2px solid #3fb950; color: #ffff00;
        font-weight: bold; border-radius: 6px; text-align: center;
    }
    .add-btn {
        font-size: 1.05rem;
        padding: 10px 16px;
        background: #2ea043;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }
    .add-btn:hover { background: #238636; }
    .clear-scores-btn {
        font-size: 1.05rem;
        padding: 10px 16px;
        background: #9e6a03;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }
    .clear-scores-btn:hover { background: #bb8009; }
    .reset-btn {
        font-size: 1.05rem;
        padding: 10px 16px;
        background: #da3633;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }
    .reset-btn:hover { background: #b62324; }
    .header-confirm {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #252525;
        border: 1px solid #555;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 0.95rem;
    }
    .confirm-yes-btn {
        background: #da3633;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        font-weight: bold;
        cursor: pointer;
    }
    .confirm-yes-btn:hover { background: #b62324; }
    .confirm-no-btn {
        background: #3a3a3a;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
    }
    .confirm-no-btn:hover { background: #4d4d4d; }
    .grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
        gap: 12px; 
        width: 100%;
    }
    .card { 
        background: #1e1e1e; 
        padding: 10px; 
        border-radius: 6px; 
        border: 1px solid #333; 
    }
    .card-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 8px; 
        font-weight: bold; 
        color: #8b949e; 
        min-height: 26px;
    }
    .delete-actions {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .confirm-label {
        font-size: 0.75rem;
        color: #f85149;
    }
    .delete-player-btn {
        background: #2a1818;
        border: 1px solid #da3633;
        color: #ff7b72;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 0.75rem;
        font-weight: bold;
        cursor: pointer;
    }
    .delete-player-btn:hover {
        background: #da3633;
        color: #ffffff;
    }
    .cancel-delete-btn {
        background: #2a2a2a;
        border: 1px solid #555;
        color: #c9d1d9;
        border-radius: 4px;
        padding: 3px 7px;
        font-size: 0.75rem;
        cursor: pointer;
    }
    .cancel-delete-btn:hover {
        background: #3a3a3a;
    }
    .row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; }
    input[type="text"].p-name, input[type="text"].p-club { 
        flex: 1; min-width: 0; background: #2a2a2a; border: 1px solid #444; color: #ffffff; padding: 6px; border-radius: 4px; font-weight: bold; 
    }
    input[type="text"].p-club {
        color: #58a6ff; font-weight: normal; font-size: 0.9rem;
    }
    .stats-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: #252525; padding: 6px; border-radius: 4px; }
    .set-box { display: flex; flex-direction: column; gap: 3px; background: #1a1a1a; padding: 4px; border-radius: 4px; text-align: center; }
    .set-box label { font-size: 0.75rem; color: #3fb950; font-weight: bold; }
    .set-box input { width: 100%; max-width: 70px; background: #2a2a2a; border: 1px solid #444; color: #ffffff; padding: 4px 2px; text-align: center; border-radius: 3px; font-size: 0.85rem; margin: 0 auto; }
    #statusBar { margin-top: 16px; font-size: 0.85rem; color: #8b949e; text-align: center; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="header-panel">
    <input type="text" id="tournamentTitle" value="Egyéni Bajnokság" placeholder="Bajnokság / Verseny Neve" oninput="sendData()">
    <button type="button" class="add-btn" onclick="addPlayer()">+ Játékos hozzáadása</button>
    <span id="clearScoresArea">
        <button type="button" class="clear-scores-btn" onclick="askClearScores()">Eredmények törlése</button>
    </span>
    <span id="resetAllArea">
        <button type="button" class="reset-btn" onclick="askResetAll()">Nullázás</button>
    </span>
</div>

<div class="grid" id="playersContainer"></div>
<div id="statusBar"></div>

<script>
window.onerror = function(msg, url, line) {
    const bar = document.getElementById("statusBar");
    if (bar) bar.textContent = "Hiba (" + line + ". sor): " + msg;
};

const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

const defaultPlayersCount = 32;
let db = null;

function setStatus(msg) {
    const bar = document.getElementById("statusBar");
    if (bar) bar.textContent = msg;
}

function renderDefaultClearScoresButton() {
    const area = document.getElementById("clearScoresArea");
    if (!area) return;
    area.innerHTML = "";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "clear-scores-btn";
    btn.textContent = "Eredmények törlése";
    btn.onclick = askClearScores;
    area.appendChild(btn);
}

function askClearScores() {
    const area = document.getElementById("clearScoresArea");
    if (!area) return;
    area.innerHTML = "";

    const box = document.createElement("span");
    box.className = "header-confirm";

    const txt = document.createElement("span");
    txt.textContent = "Eredmények törlése — Biztos?";

    const yesBtn = document.createElement("button");
    yesBtn.type = "button";
    yesBtn.className = "confirm-yes-btn";
    yesBtn.textContent = "Igen";
    yesBtn.onclick = function() {
        clearAllScores();
        renderDefaultClearScoresButton();
    };

    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "confirm-no-btn";
    noBtn.textContent = "Mégse";
    noBtn.onclick = renderDefaultClearScoresButton;

    box.appendChild(txt);
    box.appendChild(yesBtn);
    box.appendChild(noBtn);
    area.appendChild(box);
}

function clearAllScores() {
    const cards = document.querySelectorAll("#playersContainer .card");
    cards.forEach(function(card) {
        for (let s = 0; s < 4; s++) {
            card.querySelector(".p-teli" + s).value = "";
            card.querySelector(".p-tarol" + s).value = "";
            card.querySelector(".p-ures" + s).value = "";
        }
    });
    sendData();
    setStatus("Minden játékos szett-eredménye törölve (nevek és egyesületek megmaradtak).");
}

function renderDefaultResetAllButton() {
    const area = document.getElementById("resetAllArea");
    if (!area) return;
    area.innerHTML = "";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "reset-btn";
    btn.textContent = "Nullázás";
    btn.onclick = askResetAll;
    area.appendChild(btn);
}

function askResetAll() {
    const area = document.getElementById("resetAllArea");
    if (!area) return;
    area.innerHTML = "";

    const box = document.createElement("span");
    box.className = "header-confirm";

    const txt = document.createElement("span");
    txt.textContent = "Minden adat törlése — Biztos?";

    const yesBtn = document.createElement("button");
    yesBtn.type = "button";
    yesBtn.className = "confirm-yes-btn";
    yesBtn.textContent = "Igen";
    yesBtn.onclick = function() {
        createCards(defaultPlayersCount);
        sendData();
        renderDefaultResetAllButton();
        setStatus("Minden adat nullázva (32 játékos visszaállítva, verseny neve megmaradt).");
    };

    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "confirm-no-btn";
    noBtn.textContent = "Mégse";
    noBtn.onclick = renderDefaultResetAllButton;

    box.appendChild(txt);
    box.appendChild(yesBtn);
    box.appendChild(noBtn);
    area.appendChild(box);
}

function renderDeleteControls(actionsContainer, card) {
    actionsContainer.innerHTML = "";

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "delete-player-btn";
    delBtn.textContent = "Törlés";
    delBtn.onclick = function() {
        renderConfirmControls(actionsContainer, card);
    };

    actionsContainer.appendChild(delBtn);
}

function renderConfirmControls(actionsContainer, card) {
    actionsContainer.innerHTML = "";

    const label = document.createElement("span");
    label.className = "confirm-label";
    label.textContent = "Biztos?";

    const yesBtn = document.createElement("button");
    yesBtn.type = "button";
    yesBtn.className = "delete-player-btn";
    yesBtn.textContent = "Igen";
    yesBtn.onclick = function() {
        const idx = Number(card.dataset.idx) || 0;
        const currentName = card.querySelector(".p-name").value.trim();
        const playerLabel = currentName ? '"' + currentName + '" (#' + (idx + 1) + ')' : '#' + (idx + 1) + '. játékos';

        card.remove();
        reindexCards();
        sendData();
        setStatus("Eltávolítva: " + playerLabel);
    };

    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "cancel-delete-btn";
    noBtn.textContent = "Mégse";
    noBtn.onclick = function() {
        renderDeleteControls(actionsContainer, card);
    };

    actionsContainer.appendChild(label);
    actionsContainer.appendChild(yesBtn);
    actionsContainer.appendChild(noBtn);
}

function reindexCards() {
    const cards = document.querySelectorAll("#playersContainer .card");
    cards.forEach(function(card, idx) {
        card.dataset.idx = idx;
        const titleSpan = card.querySelector(".card-title");
        if (titleSpan) {
            titleSpan.textContent = "#" + (idx + 1) + " Játékos";
        }
    });
}

function buildCardElement(index) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.idx = index;

    const header = document.createElement("div");
    header.className = "card-header";

    const titleSpan = document.createElement("span");
    titleSpan.className = "card-title";
    titleSpan.textContent = "#" + (index + 1) + " Játékos";

    const actionsContainer = document.createElement("div");
    actionsContainer.className = "delete-actions";
    renderDeleteControls(actionsContainer, card);

    header.appendChild(titleSpan);
    header.appendChild(actionsContainer);

    const row = document.createElement("div");
    row.className = "row";

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "p-name";
    nameInput.placeholder = "Játékos neve";
    nameInput.oninput = sendData;

    const clubInput = document.createElement("input");
    clubInput.type = "text";
    clubInput.className = "p-club";
    clubInput.placeholder = "Egyesület / Klub";
    clubInput.oninput = sendData;

    row.appendChild(nameInput);
    row.appendChild(clubInput);

    const statsInputs = document.createElement("div");
    statsInputs.className = "stats-inputs";

    for (let s = 0; s < 4; s++) {
        const setBox = document.createElement("div");
        setBox.className = "set-box";

        const label = document.createElement("label");
        label.textContent = "S" + (s + 1);

        const teliInp = document.createElement("input");
        teliInp.type = "number";
        teliInp.className = "p-teli" + s;
        teliInp.placeholder = "Teli";
        teliInp.oninput = sendData;

        const tarolInp = document.createElement("input");
        tarolInp.type = "number";
        tarolInp.className = "p-tarol" + s;
        tarolInp.placeholder = "Tar";
        tarolInp.oninput = sendData;

        const uresInp = document.createElement("input");
        uresInp.type = "number";
        uresInp.className = "p-ures" + s;
        uresInp.placeholder = "Üres";
        uresInp.oninput = sendData;

        setBox.appendChild(label);
        setBox.appendChild(teliInp);
        setBox.appendChild(tarolInp);
        setBox.appendChild(uresInp);
        statsInputs.appendChild(setBox);
    }

    card.appendChild(header);
    card.appendChild(row);
    card.appendChild(statsInputs);

    return card;
}

function addPlayer() {
    const container = document.getElementById("playersContainer");
    if (!container) return;

    const currentCount = container.querySelectorAll(".card").length;
    const newCard = buildCardElement(currentCount);
    container.appendChild(newCard);
    reindexCards();
    sendData();
    setStatus("Hozzáadva: #" + (currentCount + 1) + ". játékos.");
}

function createCards(count) {
    const numCards = (typeof count === "number" && count >= 0) ? count : defaultPlayersCount;
    const container = document.getElementById("playersContainer");
    if (!container) return;

    container.innerHTML = "";
    for (let i = 0; i < numCards; i++) {
        container.appendChild(buildCardElement(i));
    }

    setStatus("Betöltve: " + numCards + " játékoskártya.");
}

function syncCardsCount(targetCount) {
    const container = document.getElementById("playersContainer");
    if (!container) return;

    let cards = container.querySelectorAll(".card");
    while (cards.length < targetCount) {
        container.appendChild(buildCardElement(cards.length));
        cards = container.querySelectorAll(".card");
    }
    while (cards.length > targetCount) {
        cards[cards.length - 1].remove();
        cards = container.querySelectorAll(".card");
    }
    reindexCards();
}

function initFirebaseSync() {
    try {
        if (typeof firebase === "undefined") return;
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();

        db.ref("egyeni_bowling").on("value", function(snapshot) {
            const data = snapshot.val();
            if (!data) return;

            const titleInput = document.getElementById("tournamentTitle");
            if (titleInput && document.activeElement !== titleInput && data.title) {
                titleInput.value = data.title;
            }

            if (data.players && Array.isArray(data.players)) {
                syncCardsCount(data.players.length);
                const cards = document.querySelectorAll("#playersContainer .card");

                data.players.forEach(function(player, idx) {
                    if (!player || !cards[idx]) return;
                    const card = cards[idx];
                    const nameInput = card.querySelector(".p-name");
                    const clubInput = card.querySelector(".p-club");

                    if (nameInput && document.activeElement !== nameInput) {
                        nameInput.value = (player.name && !player.name.startsWith("Játékos ")) ? player.name : "";
                    }
                    if (clubInput && document.activeElement !== clubInput) {
                        clubInput.value = player.club || "";
                    }

                    for (let s = 0; s < 4; s++) {
                        const teliInp = card.querySelector(".p-teli" + s);
                        const tarolInp = card.querySelector(".p-tarol" + s);
                        const uresInp = card.querySelector(".p-ures" + s);

                        if (player.rawSets && player.rawSets[s]) {
                            if (teliInp && document.activeElement !== teliInp) {
                                teliInp.value = player.rawSets[s].teli !== undefined ? player.rawSets[s].teli : "";
                            }
                            if (tarolInp && document.activeElement !== tarolInp) {
                                tarolInp.value = player.rawSets[s].tarol !== undefined ? player.rawSets[s].tarol : "";
                            }
                            if (uresInp && document.activeElement !== uresInp) {
                                uresInp.value = player.rawSets[s].ures !== undefined ? player.rawSets[s].ures : "";
                            }
                        }
                    }
                });
            }
        });
    } catch (e) {
        setStatus("Játékoskártyák betöltve (Firebase info: " + e.message + ")");
    }
}

function sendData() {
    if (!db) return;

    const titleEl = document.getElementById("tournamentTitle");
    const title = (titleEl && titleEl.value) ? titleEl.value : "Egyéni Bajnokság";
    const players = [];
    const cards = document.querySelectorAll("#playersContainer .card");

    cards.forEach(function(card, idx) {
        const name = card.querySelector(".p-name").value;
        const club = card.querySelector(".p-club").value;

        let totalTeli = 0, totalTarol = 0, totalUres = 0;
        const sets = [];
        const rawSets = [];

        for (let s = 0; s < 4; s++) {
            const teliVal = card.querySelector(".p-teli" + s).value;
            const tarolVal = card.querySelector(".p-tarol" + s).value;
            const uresVal = card.querySelector(".p-ures" + s).value;

            const teli = parseInt(teliVal, 10) || 0;
            const tarol = parseInt(tarolVal, 10) || 0;
            const ures = parseInt(uresVal, 10) || 0;

            totalTeli += teli;
            totalTarol += tarol;
            totalUres += ures;
            sets.push(teli + tarol);

            rawSets.push({
                teli: teliVal !== "" ? teli : "",
                tarol: tarolVal !== "" ? tarol : "",
                ures: uresVal !== "" ? ures : ""
            });
        }

        players.push({
            id: idx + 1,
            name: name || ("Játékos " + (idx + 1)),
            club: club || "",
            sets: sets,
            rawSets: rawSets,
            teli: totalTeli,
            tarol: totalTarol,
            ures: totalUres,
            total: totalTeli + totalTarol
        });
    });

    db.ref("egyeni_bowling").set({
        title: title,
        players: players
    }).catch(function(err) {
        setStatus("Mentési hiba: " + err.message);
    });
}

createCards(defaultPlayersCount);
initFirebaseSync();
</script>
</body>
</html>
